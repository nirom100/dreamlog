<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=Monsieur+La+Doulaise&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="sidebar" id="sidebar">
      <div class="saved-notes" id="saved-notes"></div>
      <button class="create-new" onclick="createNewNote()">ADD DREAM</button>
    </section>

    <section class="note-body" id="note-body">
      <h2 class="note-label">dreaming the dream</h2>

      <div class="add-note">
        <input
          id="add-note-title"
          class="add-note-header"
          type="text"
          placeholder="Add title..."
        />
        <textarea
          class="add-note-input"
          id="add-note-input"
          placeholder="What did you encounter last night?"
        ></textarea>

        <div class="add-note-buttons">
          <button class="save-button" id="save-button" onclick="saveNote()">
            SAVE
          </button>
          <button id="delete-button" onclick="deleteNote()">DISCARD</button>
        </div>
      </div>
    </section>

    <script src="index.js"></script>
    <script src="scramble.js"></script>
    <script src="header-scramble.js"></script>
  </body>
</html>
